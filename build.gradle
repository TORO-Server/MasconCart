plugins {
    id 'java'
}

group = 'prj.salmon'
version = '1.3.3'

repositories {
    mavenCentral()
    maven {
        name = "spigotmc-repo"
        url = "https://hub.spigotmc.org/nexus/content/repositories/snapshots/"
    }
    maven {
        url = "https://ci.mg-dev.eu/plugin/repository/everything"
    }
    maven {
        url = "https://central.sonatype.com/repository/maven-snapshots/"
        content { includeGroup 'org.incendo' }
    }
}

dependencies {
    compileOnly "org.spigotmc:spigot-api:1.20.4-R0.1-SNAPSHOT"
    compileOnly 'com.bergerkiller.bukkit:TrainCarts:2.0.2'
    compileOnly 'com.bergerkiller.bukkit:BKCommonLib:2.0.4'
    compileOnly 'net.dmulloy2:ProtocolLib:5.4.0'
    compileOnly 'net.kyori:adventure-api:4.17.0'
    compileOnly 'net.kyori:adventure-platform-bukkit:4.3.4'
    testImplementation 'org.junit.jupiter:junit-jupiter:5.11.4'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

configurations.testImplementation.extendsFrom(configurations.compileOnly)
tasks.named('test') { useJUnitPlatform() }

def targetJavaVersion = 17
java {
    def javaVersion = JavaVersion.toVersion(targetJavaVersion)
    sourceCompatibility = javaVersion
    targetCompatibility = javaVersion
    if (JavaVersion.current() < javaVersion) {
        toolchain.languageVersion = JavaLanguageVersion.of(targetJavaVersion)
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.compilerArgs.add("-Xlint:deprecation")

    if (targetJavaVersion >= 10 || JavaVersion.current().isJava10Compatible()) {
        options.release.set(targetJavaVersion)
    }
}

processResources {
    def props = [version: version]
    inputs.properties props
    filteringCharset 'UTF-8'
    filesMatching('plugin.yml') {
        expand props
    }
}
